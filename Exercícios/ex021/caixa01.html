<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{ /*box-level*/
            
            /*display: inline; CASO QUEIRA MUDAR PARA INLINE-LEVEL (ou vice-versa)*/

            background-color: green;
            height: 300px;
            width: 300px;

            border-width: 10px;
            border-style: solid;
            border-color: black;

            /*border:10px solid black; SHORTHAND*/

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            /*padding: 10px; SHORTHAND se as 4 medidas forem iguais, coloca apenas uma vez o valor*/

            /*margin: auto; elemento centralizado*/
            /*margin-top: 10px; 
            margin-right: 10px;
            margin-bottom: 40px;
            margin-left: 10px;*/

            margin: 10px 10px 40px 10px;

            outline-width: 5px;
            outline-style: dashed;

            outline:5px dashed;
            

        }
        a{/*inline-level*/
            border-width: 10px;
            border-style: solid;
            border-color: red;
             padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

           
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de Caixas inline-level</a>.Vamos ver como tudo isso funciona. </p>
</body>
<footer>

</footer>
</html>
